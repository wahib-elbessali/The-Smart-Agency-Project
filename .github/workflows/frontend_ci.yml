name: Frontend CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend is scaffolded
        id: scaffolded
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scaffolded.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm ci
      - name: Lint
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm run lint
      - name: Test
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm test
      - name: Build
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm run build
      - name: Frontend not scaffolded yet
        if: steps.scaffolded.outputs.ready == 'false'
        run: echo "frontend/package-lock.json not found yet - skipping frontend CI steps."
